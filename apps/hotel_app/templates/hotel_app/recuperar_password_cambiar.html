{% extends 'hotel_app/base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold mb-3 text-center" style="font-family: serif;">Nueva Contraseña</h4>
        <p class="text-muted small text-center mb-4">Ingresa tu nueva contraseña para acceder a la cuenta.</p>
        
        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-danger py-2 small">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Nueva Contraseña</label>
                <input type="password" name="nueva_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Confirmar Nueva Contraseña</label>
                <input type="password" name="confirmar_password" class="form-control" required>
            </div>
            <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold" style="background-color: #8c8275;">
                Actualizar Contraseña
            </button>
        </form>
    </div>
</div>
{% endblock %}
