{% extends 'hotel_app/base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold mb-3 text-center" style="font-family: serif;">Verificar Código</h4>
        <p class="text-muted small text-center mb-4">Ingresa el código de 6 dígitos que fue enviado a tu correo electrónico.</p>
        
        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-danger py-2 small">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3 text-center">
                <input type="text" name="codigo" class="form-control text-center fs-4 tracking-widest" placeholder="123456" maxlength="6" required>
            </div>
            <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold" style="background-color: #8c8275;">
                Verificar Código
            </button>
        </form>
    </div>
</div>
{% endblock %}
