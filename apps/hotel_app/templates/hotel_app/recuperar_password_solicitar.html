{% extends 'hotel_app/base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 450px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h4 class="fw-bold mb-3 text-center" style="font-family: serif;">Recuperar Contraseña</h4>
        <p class="text-muted small text-center mb-4">Ingresa tu usuario o correo registrado y te enviaremos un código de recuperación.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario o Correo</label>
                <input type="text" name="identificador" class="form-control" required>
            </div>
            <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold" style="background-color: #8c8275;">
                Enviar Código
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Volver al Login</a>
        </div>
    </div>
</div>
{% endblock %}
