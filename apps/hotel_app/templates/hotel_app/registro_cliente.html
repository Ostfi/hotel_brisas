<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Hotel Brisas de La Guajira</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .register-card {
            max-width: 650px;
            width: 100%;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }
        .btn-hotel {
            background-color: #8c8275;
            color: white;
            transition: opacity 0.2s;
        }
        .btn-hotel:hover {
            background-color: #7a7064;
            color: white;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="card register-card mx-auto">
            <div class="card-body p-4 p-md-5">
                <!-- TÍTULO SERIF ESTILO FORMULARIO -->
                <h3 class="fw-bold mb-1 text-dark" style="font-family: serif; letter-spacing: 0.3px;">Crear cuenta de cliente</h3>
                <p class="text-muted small mb-4">Regístrate completando tu información personal para consultar y solicitar reservas.</p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 small rounded-3 mb-3" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Nombre de usuario</label>
                            <input type="text" name="username" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="Ej. carlosslim" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Correo electrónico</label>
                            <input type="email" name="email" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Contraseña</label>
                            <input type="password" name="password" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="********" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Confirmar Contraseña</label>
                            <input type="password" name="confirm_password" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="********" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Nombres</label>
                            <input type="text" name="nombres" data-letters-only="true" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="Tus nombres" value="{{ form.nombres.value|default:'' }}" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Apellidos</label>
                            <input type="text" name="apellidos" data-letters-only="true" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="Tus apellidos" value="{{ form.apellidos.value|default:'' }}" required>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Tipo de Documento</label>
                            <select name="tipo_documento" class="form-select rounded-3 py-2" style="font-size: 0.9rem;" required>
                                <option value="CC">Cédula de Ciudadanía (CC)</option>
                                <option value="CE">Cédula de Extranjería (CE)</option>
                                <option value="Pasaporte">Pasaporte</option>
                                <option value="TI">Tarjeta de Identidad (TI)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-bold text-dark small">Número de Documento</label>
                            <input type="text" name="documento" data-digits-only="true" inputmode="numeric" pattern="[0-9]+" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="Número de documento" value="{{ form.documento.value|default:'' }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-dark small">Teléfono</label>
                            <input type="text" name="telefono" data-digits-only="true" inputmode="numeric" pattern="[0-9]+" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" placeholder="Número de contacto" value="{{ form.telefono.value|default:'' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-dark small">Nacionalidad</label>
                            <input type="text" name="nacionalidad" data-letters-only="true" class="form-control rounded-3 py-2" style="font-size: 0.9rem;" value="{{ form.nacionalidad.value|default:'Colombiana' }}" required>
                        </div>
                    </div>

                    <div class="d-grid pt-2">
                        <button type="submit" class="btn btn-hotel rounded-pill py-2 shadow-sm fw-medium" style="font-size: 0.95rem;">
                            Crear cuenta
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">
                        ¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none fw-medium" style="color: #8c8275;">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
